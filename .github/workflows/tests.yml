name: Clustering tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install -r requirements.txt
          python -m pytest tests/ -v
          python -m src.tasks
